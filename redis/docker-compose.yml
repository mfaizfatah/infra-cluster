services:
  redis:
    image: redis:7.2-alpine
    container_name: redis
    restart: unless-stopped
    command: >-
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is not set}
      --maxmemory ${REDIS_MAXMEMORY:-128mb}
      --maxmemory-policy noeviction
      --appendonly yes
      --save 900 1
      --save 300 10
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEMORY_LIMIT:-256m}
          cpus: "${REDIS_CPU_LIMIT:-0.5}"
        reservations:
          memory: ${REDIS_MEMORY_RESERVATION:-128m}
          cpus: "${REDIS_CPU_RESERVATION:-0.1}"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app_network

volumes:
  redis_data:
    driver: local

networks:
  app_network:
    external: true
    name: app_network
